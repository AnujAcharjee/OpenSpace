<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f293d" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Service Gradients -->
    <linearGradient id="gatewayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <linearGradient id="httpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>

    <linearGradient id="chatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="wsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>

    <linearGradient id="redisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#134e4a" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#60a5fa" flood-opacity="0.4" />
    </filter>

    <!-- Markers for arrows -->
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#60a5fa" />
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#c084fc" />
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#34d399" />
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#fb923c" />
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#f87171" />
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; fill: #ffffff; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; fill: #9ca3af; font-size: 14px; }
    .node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 16px; fill: #ffffff; }
    .node-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 600; }
    .node-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #94a3b8; }
    .flow-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; }
    .legend-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #cbd5e1; }
  </style>

  <!-- Background Base -->
  <rect width="1400" height="900" fill="url(#bgGrad)" />

  <!-- Grid overlay pattern for technical depth -->
  <g opacity="0.04">
    <path d="M 0,0 L 1400,0 M 0,50 L 1400,50 M 0,100 L 1400,100 M 0,150 L 1400,150 M 0,200 L 1400,200 M 0,250 L 1400,250 M 0,300 L 1400,300 M 0,350 L 1400,350 M 0,400 L 1400,400 M 0,450 L 1400,450 M 0,500 L 1400,500 M 0,550 L 1400,550 M 0,600 L 1400,600 M 0,650 L 1400,650 M 0,700 L 1400,700 M 0,750 L 1400,750 M 0,800 L 1400,800 M 0,850 L 1400,850" stroke="#ffffff" stroke-width="1" />
    <path d="M 0,0 L 0,900 M 50,0 L 50,900 M 100,0 L 100,900 M 150,0 L 150,900 M 200,0 L 200,900 M 250,0 L 250,900 M 300,0 L 300,900 M 350,0 L 350,900 M 400,0 L 400,900 M 450,0 L 450,900 M 500,0 L 500,900 M 550,0 L 550,900 M 600,0 L 600,900 M 650,0 L 650,900 M 700,0 L 700,900 M 750,0 L 750,900 M 800,0 L 800,900 M 850,0 L 850,900 M 900,0 L 900,900 M 950,0 L 950,900 M 1000,0 L 1000,900 M 1050,0 L 1050,900 M 1100,0 L 1100,900 M 1150,0 L 1150,900 M 1200,0 L 1200,900 M 1250,0 L 1250,900 M 1300,0 L 1300,900 M 1350,0 L 1350,900" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Header Section -->
  <g transform="translate(60, 45)">
    <text class="title" font-size="28" letter-spacing="-0.5">COLLAB SYSTEM ARCHITECTURE</text>
    <text class="subtitle" y="26">Distributed Real-Time Messaging Monorepo (Next.js • Express • Redis Streams/PubSub • Prisma • PostgreSQL)</text>
    <rect x="0" y="38" width="1280" height="2" fill="url(#highlightGrad)" opacity="0.8" />
  </g>

  <!-- ==================== TIER 1: CLIENT & EDGE ==================== -->
  
  <!-- Client (Next.js) -->
  <g transform="translate(60, 120)" filter="url(#shadow)">
    <rect width="260" height="120" rx="12" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="28" cy="28" r="14" fill="#1e3a8a" />
    <path d="M 22 28 L 26 32 L 34 24" stroke="#60a5fa" stroke-width="2" fill="none" stroke-linecap="round" />
    <text x="52" y="26" class="node-title">Next.js Web App</text>
    <text x="52" y="42" class="node-tag" fill="#60a5fa">apps/web :3000</text>
    <text x="20" y="74" class="node-desc">• Real-time chat interface</text>
    <text x="20" y="92" class="node-desc">• State management &amp; active WS client</text>
    <text x="20" y="110" class="node-desc">• Avatar uploads (Cloudinary AVIF)</text>
  </g>

  <!-- Caddy / Edge Proxy -->
  <g transform="translate(390, 120)" filter="url(#shadow)">
    <rect width="260" height="120" rx="12" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1.5" />
    <circle cx="28" cy="28" r="14" fill="#164e63" />
    <path d="M 21 28 C 21 24 35 24 35 28 C 35 33 21 33 21 28 Z" stroke="#22d3ee" stroke-width="1.5" fill="none" />
    <text x="52" y="26" class="node-title">Caddy Edge Proxy</text>
    <text x="52" y="42" class="node-tag" fill="#22d3ee">Port 80 / 443 (TLS)</text>
    <text x="20" y="74" class="node-desc">• Auto-HTTPS (Let's Encrypt)</text>
    <text x="20" y="92" class="node-desc">• HTTP/2 &amp; HTTP/3 protocol termination</text>
    <text x="20" y="110" class="node-desc">• DDoS / Slowloris protection</text>
  </g>

  <!-- API Gateway -->
  <g transform="translate(720, 105)" filter="url(#shadow)">
    <rect width="320" height="150" rx="14" fill="url(#gatewayGrad)" stroke="#818cf8" stroke-width="2" />
    <circle cx="32" cy="32" r="16" fill="#3730a3" />
    <path d="M 24 32 L 40 32 M 32 24 L 32 40" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round" />
    <text x="58" y="28" class="node-title">API Gateway</text>
    <text x="58" y="46" class="node-tag" fill="#a5b4fc">apps/api-gateway :3005</text>
    <text x="24" y="78" class="node-desc" fill="#e0e7ff">• <tspan font-weight="700">Raw Streaming Proxy</tspan> (Zero in-memory JSON buffering)</text>
    <text x="24" y="96" class="node-desc" fill="#e0e7ff">• JWT Verification &amp; Cookie extraction via <tspan fill="#a5b4fc">@repo/auth</tspan></text>
    <text x="24" y="114" class="node-desc" fill="#e0e7ff">• Header Injection (<tspan font-family="monospace">x-user-id</tspan>, <tspan font-family="monospace">x-gateway-secret</tspan>)</text>
    <text x="24" y="132" class="node-desc" fill="#e0e7ff">• Sliding-window Redis Rate Limiting &amp; WS Upgrades</text>
  </g>

  <!-- ==================== TIER 2: MICROSERVICES LAYER ==================== -->
  
  <!-- HTTP Service -->
  <g transform="translate(100, 360)" filter="url(#shadow)">
    <rect width="340" height="170" rx="14" fill="url(#httpGrad)" stroke="#34d399" stroke-width="1.5" />
    <circle cx="30" cy="30" r="14" fill="#065f46" />
    <path d="M 22 30 L 38 30 M 30 22 L 38 30 L 30 38" stroke="#6ee7b7" stroke-width="2" fill="none" stroke-linecap="round" />
    <text x="54" y="27" class="node-title">HTTP Service</text>
    <text x="54" y="44" class="node-tag" fill="#6ee7b7">apps/http-service :3003</text>
    <text x="20" y="76" class="node-desc" fill="#d1fae5">• User Signin, Signup &amp; Pramaan OAuth 2.0</text>
    <text x="20" y="96" class="node-desc" fill="#d1fae5">• Room Creation, Discovery &amp; Search</text>
    <text x="20" y="116" class="node-desc" fill="#d1fae5">• Memberships &amp; Join Request Approvals</text>
    <text x="20" y="136" class="node-desc" fill="#d1fae5">• User Hydration (<tspan fill="#a7f3d0">user + joined rooms</tspan>)</text>
    <text x="20" y="156" class="node-desc" font-weight="700" fill="#a7f3d0">⚡ Single-Hop direct queries via @repo/db</text>
  </g>

  <!-- Chat Service -->
  <g transform="translate(520, 360)" filter="url(#shadow)">
    <rect width="360" height="170" rx="14" fill="url(#chatGrad)" stroke="#60a5fa" stroke-width="1.5" />
    <circle cx="30" cy="30" r="14" fill="#1e40af" />
    <path d="M 23 26 C 23 23 37 23 37 26 C 37 32 30 33 30 36 M 30 40 L 30 41" stroke="#93c5fd" stroke-width="2" fill="none" stroke-linecap="round" />
    <text x="54" y="27" class="node-title">Chat Service</text>
    <text x="54" y="44" class="node-tag" fill="#93c5fd">apps/chat-service :3001</text>
    <text x="20" y="76" class="node-desc" fill="#dbeafe">• High-Throughput Message Ingestion</text>
    <text x="20" y="96" class="node-desc" fill="#dbeafe">• Message History &amp; Message Edit / Soft-Delete</text>
    <text x="20" y="116" class="node-desc" fill="#dbeafe">• <tspan font-weight="700">Dual-Write Ingestion Pipeline:</tspan></text>
    <text x="35" y="136" class="node-desc" fill="#93c5fd">1. Pub/Sub <tspan font-family="monospace">chat-messages</tspan> (Live delivery)</text>
    <text x="35" y="154" class="node-desc" fill="#93c5fd">2. Stream <tspan font-family="monospace">stream:chat-messages</tspan> (Persistence)</text>
  </g>

  <!-- WebSocket Service -->
  <g transform="translate(960, 360)" filter="url(#shadow)">
    <rect width="340" height="170" rx="14" fill="url(#wsGrad)" stroke="#c084fc" stroke-width="1.5" />
    <circle cx="30" cy="30" r="14" fill="#7e22ce" />
    <path d="M 22 26 C 26 22 34 22 38 26 M 25 30 C 27 28 33 28 35 30 M 30 35 L 30 37" stroke="#e9d5ff" stroke-width="2" fill="none" stroke-linecap="round" />
    <text x="54" y="27" class="node-title">WebSocket Service</text>
    <text x="54" y="44" class="node-tag" fill="#e9d5ff">apps/ws-service :3002</text>
    <text x="20" y="76" class="node-desc" fill="#f3e8ff">• Stateful TCP WebSocket Client Gateway</text>
    <text x="20" y="96" class="node-desc" fill="#f3e8ff">• Authenticates via 1-time Redis connection ticket</text>
    <text x="20" y="116" class="node-desc" fill="#f3e8ff">• Subscribes to Redis Pub/Sub channels</text>
    <text x="20" y="136" class="node-desc" fill="#f3e8ff">• Dispatches events directly to matching online sockets</text>
    <text x="20" y="156" class="node-desc" fill="#e9d5ff">⚡ Sub-50ms message delivery latency</text>
  </g>

  <!-- ==================== TIER 3: STORAGE & INFRASTRUCTURE ==================== -->
  
  <!-- Shared Database Layer (@repo/db) Container -->
  <g transform="translate(100, 620)" filter="url(#shadow)">
    <rect width="580" height="230" rx="16" fill="url(#dbGrad)" stroke="#2dd4bf" stroke-width="2" />
    <text x="30" y="34" class="node-title" font-size="18">Shared Database Layer (@repo/db)</text>
    <text x="30" y="52" class="node-tag" fill="#99f6e4">packages/db • Prisma Client Singleton • Environment Config</text>
    
    <!-- Postgres Database Inner Box -->
    <g transform="translate(24, 70)">
      <rect width="532" height="136" rx="10" fill="#042f2e" stroke="#14b8a6" stroke-width="1.2" />
      <circle cx="28" cy="26" r="12" fill="#0f766e" />
      <path d="M 22 26 C 22 22 34 22 34 26 C 34 30 22 30 22 26 Z M 22 26 L 22 32 C 22 36 34 36 34 32 L 34 26" stroke="#5eead4" stroke-width="1.5" fill="none" />
      <text x="48" y="24" class="node-title" font-size="15">Neon PostgreSQL Database Server</text>
      <text x="48" y="38" class="node-tag" fill="#5eead4">Serverless Cloud PostgreSQL Cluster</text>
      <text x="20" y="68" class="node-desc" fill="#ccfbf1">• Models: <tspan font-weight="700">User, ChatRoom, ChatRoomMember, ChatMessage, Reaction, JoinRequest</tspan></text>
      <text x="20" y="88" class="node-desc" fill="#ccfbf1">• Connection Pooling (<tspan font-family="monospace">ep-soft-mouse-pooler</tspan>)</text>
      <text x="20" y="108" class="node-desc" fill="#ccfbf1">• Clean type definitions generated directly to <tspan font-family="monospace">packages/db/generated/prisma</tspan></text>
      <text x="20" y="126" class="node-desc" font-weight="700" fill="#5eead4">✨ ZERO gRPC overhead • Direct 1-hop execution</text>
    </g>
  </g>

  <!-- Redis Infrastructure Container -->
  <g transform="translate(740, 620)" filter="url(#shadow)">
    <rect width="560" height="230" rx="16" fill="url(#redisGrad)" stroke="#f87171" stroke-width="2" />
    <text x="30" y="34" class="node-title" font-size="18">Redis Distributed Infrastructure</text>
    <text x="30" y="52" class="node-tag" fill="#fecaca">packages/redis • Shared Client &amp; Event Handlers</text>

    <!-- Redis Channels Box -->
    <g transform="translate(24, 70)">
      <rect width="512" height="136" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="1.2" />
      
      <!-- Sub-blocks inside Redis -->
      <g transform="translate(16, 16)">
        <rect width="230" height="104" rx="8" fill="#7f1d1d" stroke="#f87171" stroke-width="1" />
        <text x="12" y="22" class="node-title" font-size="13" fill="#ffffff">Redis Pub/Sub</text>
        <text x="12" y="38" class="node-tag" font-size="10" fill="#fecaca">chat-messages</text>
        <text x="12" y="60" class="node-desc" font-size="11" fill="#fee2e2">• Instant fanout to active WS</text>
        <text x="12" y="78" class="node-desc" font-size="11" fill="#fee2e2">• Real-time message broadcasting</text>
        <text x="12" y="94" class="node-desc" font-size="11" fill="#fee2e2">• Receiver filtering</text>
      </g>

      <g transform="translate(262, 16)">
        <rect width="234" height="104" rx="8" fill="#7f1d1d" stroke="#f87171" stroke-width="1" />
        <text x="12" y="22" class="node-title" font-size="13" fill="#ffffff">Redis Streams</text>
        <text x="12" y="38" class="node-tag" font-size="10" fill="#fecaca">stream:chat-messages</text>
        <text x="12" y="60" class="node-desc" font-size="11" fill="#fee2e2">• Ordered append-only log</text>
        <text x="12" y="78" class="node-desc" font-size="11" fill="#fee2e2">• Consumer Group (<tspan font-family="monospace">db-workers</tspan>)</text>
        <text x="12" y="94" class="node-desc" font-size="11" fill="#fee2e2">• Batching + DLQ recovery</text>
      </g>
    </g>
  </g>

  <!-- ==================== FLOW CONNECTIONS & ARROWS ==================== -->
  
  <!-- Client to Caddy -->
  <path d="M 320 180 L 390 180" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowBlue)" />
  <text x="332" y="172" class="flow-label" fill="#60a5fa">HTTPS</text>

  <!-- Caddy to Gateway -->
  <path d="M 650 180 L 720 180" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowBlue)" />
  <text x="660" y="172" class="flow-label" fill="#22d3ee">Proxy :3005</text>

  <!-- Gateway to HTTP Service -->
  <path d="M 740 255 C 740 310 270 310 270 360" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#arrowGreen)" />
  <text x="350" y="315" class="flow-label" fill="#34d399">/api/v1/auth, /users, /rooms</text>

  <!-- Gateway to Chat Service -->
  <path d="M 850 255 L 700 360" stroke="#60a5fa" stroke-width="2" fill="none" marker-end="url(#arrowBlue)" />
  <text x="785" y="310" class="flow-label" fill="#60a5fa">/api/v1/chat</text>

  <!-- Gateway to WS Service (Upgrade) -->
  <path d="M 980 255 C 980 300 1100 300 1100 360" stroke="#c084fc" stroke-width="2" fill="none" marker-end="url(#arrowPurple)" />
  <text x="1055" y="315" class="flow-label" fill="#c084fc">/ws (Upgrade)</text>

  <!-- HTTP Service to DB -->
  <path d="M 270 530 L 270 620" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#arrowGreen)" />
  <text x="278" y="580" class="flow-label" fill="#2dd4bf">Direct Prisma Queries</text>

  <!-- Chat Service to DB (History / Edits) -->
  <path d="M 580 530 L 480 620" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrowGreen)" />
  <text x="540" y="580" class="flow-label" fill="#2dd4bf">History / Edits</text>

  <!-- Chat Service to Redis Pub/Sub & Stream -->
  <path d="M 800 530 L 920 620" stroke="#f87171" stroke-width="2.5" marker-end="url(#arrowRed)" />
  <text x="870" y="580" class="flow-label" fill="#f87171">XADD &amp; PUBLISH</text>

  <!-- Redis Pub/Sub to WS Service -->
  <path d="M 1040 620 L 1110 530" stroke="#c084fc" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowPurple)" />
  <text x="1080" y="580" class="flow-label" fill="#c084fc">SUBSCRIBE</text>

  <!-- WS Service back to Client (Live Push) -->
  <path d="M 1200 360 C 1360 360 1360 80 260 80 C 210 80 210 110 210 120" stroke="#e879f9" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrowPurple)" />
  <text x="1245" y="210" class="flow-label" fill="#e879f9">⚡ Real-Time WS Push</text>

  <!-- ==================== LEGEND SECTION ==================== -->
  <g transform="translate(60, 868)">
    <circle cx="10" cy="10" r="5" fill="#60a5fa" />
    <text x="22" y="14" class="legend-text">Client / HTTP Stream</text>

    <circle cx="170" cy="10" r="5" fill="#34d399" />
    <text x="182" y="14" class="legend-text">Direct DB Query (@repo/db)</text>

    <circle cx="370" cy="10" r="5" fill="#f87171" />
    <text x="382" y="14" class="legend-text">Redis Pipeline (Stream + PubSub)</text>

    <circle cx="610" cy="10" r="5" fill="#c084fc" />
    <text x="622" y="14" class="legend-text">WebSocket State / Subscription</text>

    <circle cx="850" cy="10" r="5" fill="#e879f9" />
    <text x="862" y="14" class="legend-text">Live Socket Push (&lt;50ms)</text>
  </g>
</svg>