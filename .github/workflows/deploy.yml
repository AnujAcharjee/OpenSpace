name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'apps/web2.0/**'
      - '**/*.md'
      - '**/*.svg'
      - '**/*.png'
      - '**/*.ico'
      - 'LICENSE'
      - '.gitignore'
      - '.prettier*'
      - '.vscode/**'
      - '**/.env*'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to EC2 after building images?'
        required: false
        type: boolean
        default: true

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests & Type Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @repo/db exec prisma generate

      - name: Build & Type Check
        run: pnpm turbo run build check-types --filter=!web2.0

      - name: Run Automated Tests
        run: pnpm test

  build-and-push:
    name: Build & Push Docker Images
    needs: test
    if: >-
      !contains(github.event.head_commit.message, '[skip deploy]') &&
      !contains(github.event.head_commit.message, '[skip-deploy]') &&
      !contains(github.event.head_commit.message, '[no deploy]') &&
      !contains(github.event.head_commit.message, '[no-deploy]') &&
      !contains(github.event.head_commit.message, '[skip cd]') &&
      !contains(github.event.head_commit.message, '[skip-cd]')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - http-service
          - chat-service
          - ws-service
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'anuj304' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            APP_NAME=${{ matrix.service }}
          push: true
          tags: |
            anuj304/openspace:${{ matrix.service }}
            anuj304/openspace:${{ matrix.service }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2 via SSH
    needs: build-and-push
    if: >-
      contains(github.event.head_commit.message, '[deploy]') ||
      contains(github.event.head_commit.message, '[deploy-ec2]') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Compose & Caddy Config to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.full.yml,Caddyfile"
          target: "~/app"

      - name: Deploy Docker Compose Services
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -e

            # Ensure app directory exists and navigate into it
            mkdir -p "$HOME/app"
            cd "$HOME/app"

            # 1. Stop the running servers totally before starting new deployment
            if [ -f "docker-compose.yml" ]; then
              docker compose down 2>/dev/null || true
            fi
            docker rm -f openspace_caddy openspace_api_gateway openspace_http_service openspace_chat_service openspace_ws_service collab_caddy collab_api_gateway collab_http_service collab_chat_service collab_ws_service 2>/dev/null || true

            # 2. Write production .env and .env.production files
            cat << 'EOF' > .env
            NODE_ENV=production
            API_DOMAIN=api.openspace.anujacharjee.com
            ACME_EMAIL=me@anujacharjee.com

            # Public Domain & Cookie Settings (Static)
            WEB_APP_URL=https://openspace.anujacharjee.com
            API_GATEWAY_URL=https://api.openspace.anujacharjee.com
            COOKIE_DOMAIN=.anujacharjee.com
            COOKIE_SAME_SITE=lax
            ACCESS_TOKEN_COOKIE_NAME=accessToken
            PRAMAAN_SERVER_URL=https://api.pramaan.anujacharjee.com
            CALLBACK_URL=https://api.openspace.anujacharjee.com/api/v1/auth/pramaan/callback

            # Sensitive Credentials (Injected from GitHub Repository Secrets)
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            REDIS_URL=${{ secrets.REDIS_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            GATEWAY_INTERNAL_SECRET=${{ secrets.GATEWAY_INTERNAL_SECRET }}
            PRAMAAN_CLIENT_ID=${{ secrets.PRAMAAN_CLIENT_ID }}
            PRAMAAN_CLIENT_SECRET=${{ secrets.PRAMAAN_CLIENT_SECRET }}
            PRAMAAN_SECRET=${{ secrets.PRAMAAN_CLIENT_SECRET }}
            OPENSPACE_SECRET=${{ secrets.PRAMAAN_CLIENT_SECRET }}
            EOF
            cp .env .env.production

            # 3. Setup docker-compose.yml (transferred via SCP along with Caddyfile)
            cp docker-compose.full.yml docker-compose.yml

            # 4. Login to Docker Hub
            if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
              echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME || 'anuj304' }}" --password-stdin
            fi

            # 5. Pull latest images and recreate containers cleanly
            docker compose pull
            docker compose up -d --remove-orphans

            # 6. Clean untagged dangling images after deployment
            docker image prune -f || true
