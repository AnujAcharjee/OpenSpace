name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'apps/web/**'
      - 'apps/web2.0/**'
      - '**/*.md'
      - '**/*.svg'
      - '**/*.png'
      - '**/*.ico'
      - 'LICENSE'
      - '.gitignore'
      - '.prettier*'
      - '.vscode/**'
      - '**/.env.example'
      - '**/.env.development.example'
      - '**/.env.development.local'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests & Type Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @repo/db exec prisma generate

      - name: Build & Type Check
        run: pnpm turbo run build check-types --filter=!web

      - name: Run Automated Tests
        run: pnpm test

  build-and-push:
    name: Build & Push Docker Images
    needs: test
    if: >-
      !contains(github.event.head_commit.message, '[skip deploy]') &&
      !contains(github.event.head_commit.message, '[skip-deploy]') &&
      !contains(github.event.head_commit.message, '[no deploy]') &&
      !contains(github.event.head_commit.message, '[no-deploy]') &&
      !contains(github.event.head_commit.message, '[skip cd]') &&
      !contains(github.event.head_commit.message, '[skip-cd]')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - http-service
          - chat-service
          - ws-service
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'anuj304' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            APP_NAME=${{ matrix.service }}
          push: true
          tags: |
            anuj304/openspace:${{ matrix.service }}
            anuj304/openspace:${{ matrix.service }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

