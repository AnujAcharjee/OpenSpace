name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'apps/web/**'
      - '**/*.md'
      - '**/*.svg'
      - '**/*.png'
      - '**/*.ico'
      - 'LICENSE'
      - '.gitignore'
      - '.prettier*'
      - '.vscode/**'
      - '**/.env.example'
      - '**/.env.development.local'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests & Type Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @repo/db exec prisma generate

      - name: Build, Test & Type Check
        run: pnpm turbo run build test check-types --filter=!web

  deploy:
    name: Deploy to EC2 via SSH
    needs: test
    if: >-
      !contains(github.event.head_commit.message, '[skip deploy]') &&
      !contains(github.event.head_commit.message, '[skip-deploy]') &&
      !contains(github.event.head_commit.message, '[no deploy]') &&
      !contains(github.event.head_commit.message, '[no-deploy]') &&
      !contains(github.event.head_commit.message, '[skip cd]') &&
      !contains(github.event.head_commit.message, '[skip-cd]')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Docker Compose Services
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          command_timeout: 30m
          script: |
            set -e

            # Auto-clone repo if it does not exist yet
            if [ ! -d "$HOME/Collab" ]; then
              git clone https://github.com/${{ github.repository }}.git $HOME/Collab
            fi

            # Navigate to project root directory
            cd "$HOME/Collab"

            # Pull latest code from main
            git fetch origin main
            git reset --hard origin/main

            # Write production .env file (Safe public URIs/configs directly defined + secrets for credentials)
            cat << 'EOF' > .env
            NODE_ENV=production
            API_DOMAIN=${{ secrets.API_DOMAIN || 'api.collab.anujacharjee.com' }}
            ACME_EMAIL=${{ secrets.ACME_EMAIL || 'anujacharjee36@gmail.com' }}

            # Serverless Databases (Sensitive)
            REDIS_URL=${{ secrets.REDIS_URL }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}

            # Frontend Allowed Origin & Cookie Settings (Public / Non-sensitive)
            WEB_APP_URL=${{ secrets.WEB_APP_URL || 'https://collab.anujacharjee.com' }}
            COOKIE_DOMAIN=${{ secrets.COOKIE_DOMAIN || '.anujacharjee.com' }}
            COOKIE_SAME_SITE=${{ secrets.COOKIE_SAME_SITE || 'lax' }}
            ACCESS_TOKEN_COOKIE_NAME=${{ secrets.ACCESS_TOKEN_COOKIE_NAME || 'accessToken' }}

            # Application Secrets (Sensitive)
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            GATEWAY_INTERNAL_SECRET=${{ secrets.GATEWAY_INTERNAL_SECRET }}

            # Pramaan OAuth (Public endpoints + Sensitive Credentials)
            PRAMAAN_CLIENT_ID=${{ secrets.PRAMAAN_CLIENT_ID }}
            PRAMAAN_SECRET=${{ secrets.PRAMAAN_CLIENT_SECRET || secrets.PRAMAAN_SECRET }}
            PRAMAAN_SERVER_URL=${{ secrets.PRAMAAN_SERVER_URL || 'https://pramaan.anujacharjee.com' }}
            CALLBACK_URL=${{ secrets.CALLBACK_URL || 'https://api.collab.anujacharjee.com/api/v1/auth/pramaan/callback' }}
            EOF

            # 1. Stop backend services and remove old containers (keep Caddy running)
            docker compose stop api-gateway http-service chat-service ws-service || true
            docker compose rm -f api-gateway http-service chat-service ws-service || true

            # 2. Build and start all services in detached mode (using cached layers)
            docker compose up -d --build --remove-orphans

            # 3. Clean untagged dangling images after deployment
            docker image prune -f || true
